<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudarshan // Authenticate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050505;
            --panel-bg: rgba(13, 13, 13, 0.85);
            --border-color: #1f1f1f;
            --accent-gold: #ffaa00;
            --accent-cyan: #00f0ff;
            --accent-red: #ff4444;
            --text-main: #e0e0e0;
            --text-muted: #666;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 170, 0, 0.05), transparent 40%);
        }
        .login-card {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 15px rgba(255, 170, 0, 0.1);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h1 span { color: var(--accent-gold); }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }
        .input-group input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }
        .btn-auth {
            width: 100%;
            background: rgba(255, 170, 0, 0.1);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-auth:hover {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 15px var(--accent-gold);
        }
        .error-banner {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Sudarshan // <span>Auth</span></h1>
        {% if error %}
        <div class="error-banner">[!] {{ error }}</div>
        {% endif %}
        <form action="/login" method="POST">
            <div class="input-group">
                <label for="username">Operator ID</label>
                <input type="text" id="username" name="username" required autocomplete="username" autofocus>
            </div>
            <div class="input-group">
                <label for="password">Passkey</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-auth">Access Console</button>
        </form>
    </div>
</body>
</html>
