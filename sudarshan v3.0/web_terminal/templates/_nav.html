<style>
    .topnav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.85rem 1.5rem;
        background: #0d0d0d;
        border: 1px solid #1f1f1f;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        margin-bottom: 0;
    }
    .topnav .topnav-left { display: flex; align-items: center; gap: 1.5rem; }
    .topnav .topnav-logo {
        color: #ffaa00;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 1px;
    }
    .topnav .topnav-link {
        color: #666;
        text-decoration: none;
        padding: 0.35rem 0.7rem;
        border-radius: 4px;
        transition: all 0.2s;
        border: 1px solid transparent;
    }
    .topnav .topnav-link:hover { color: #e0e0e0; }
    .topnav .topnav-link.active {
        color: #00f0ff;
        border-color: #00f0ff;
        background: rgba(0, 240, 255, 0.07);
    }
    .topnav .topnav-right {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    .topnav .topnav-user { color: #666; }
    .topnav .topnav-logout {
        color: #ff4444;
        text-decoration: none;
        border: 1px solid #ff4444;
        padding: 0.4rem 0.9rem;
        border-radius: 4px;
        transition: all 0.2s;
        text-transform: uppercase;
        font-size: 0.75rem;
    }
    .topnav .topnav-logout:hover { background: rgba(255, 68, 68, 0.1); }
</style>
<nav class="topnav">
    <div class="topnav-left">
        <a href="/" class="topnav-logo">SUDARSHAN</a>
        <a href="/" class="topnav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/terminal" class="topnav-link {% if active_page == 'terminal' %}active{% endif %}">Terminal</a>
    </div>
    <div class="topnav-right">
        <span class="topnav-user">{{ username | upper }}</span>
        <a href="/logout" class="topnav-logout">Logout</a>
    </div>
</nav>
